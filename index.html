
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#080808">
<title>darkmess — Messages</title>

<style>
:root {
  --bg: #080808;
  --panel: #111111;
  --card: #191919;
  --red: #ff3030;
  --red-dark: #c91f1f;
  --text: #ffffff;
  --muted: #999999;
  --border: #292929;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: Arial, sans-serif;
}
button, input, textarea { font: inherit; }
button { cursor: pointer; }
button:focus-visible, input:focus-visible {
  outline: 2px solid var(--red);
  outline-offset: 2px;
}
.app {
  display: grid;
  grid-template-columns: 320px 1fr;
  height: 100dvh;
  max-width: 1500px;
  margin: auto;
  border-left: 1px solid var(--border);
  border-right: 1px solid var(--border);
}
.sidebar {
  border-right: 1px solid var(--border);
  background: var(--panel);
  display: flex;
  flex-direction: column;
  min-height: 0;
}
.brand {
  padding: 22px;
  font-size: 27px;
  font-weight: 800;
  letter-spacing: -1px;
}
.brand span { color: var(--red); }
.profile {
  padding: 0 18px 18px;
  display: flex;
  align-items: center;
  gap: 11px;
  border-bottom: 1px solid var(--border);
}
.avatar {
  width: 43px; height: 43px; flex-shrink: 0;
  display: grid; place-items: center;
  border-radius: 50%;
  background: var(--red);
  color: white; font-weight: bold;
}
.profile small, .conversation small { color: var(--muted); }
.search { padding: 15px; }
.search input, .auth-input {
  width: 100%; padding: 12px 14px;
  border: 1px solid var(--border);
  border-radius: 10px; background: var(--card);
  color: white;
}
.section-label {
  padding: 0 18px 10px;
  font-size: 12px; color: var(--muted);
  text-transform: uppercase; letter-spacing: 1px;
}
.stories {
  display: flex; gap: 14px; overflow-x: auto;
  padding: 0 15px 18px;
  border-bottom: 1px solid var(--border);
}
.story { min-width: 55px; text-align: center; font-size: 11px; }
.story-ring {
  width: 49px; height: 49px; margin: auto auto 6px;
  padding: 3px; border-radius: 50%;
  border: 2px solid var(--red);
}
.story-ring div {
  height: 100%; border-radius: 50%;
  display: grid; place-items: center;
  background: #282828; font-weight: bold;
}
.conversation-list { overflow-y: auto; flex: 1; }
.conversation {
  width: 100%; padding: 13px 17px; display: flex;
  gap: 11px; align-items: center; text-align: left;
  background: transparent; color: white;
  border: 0; border-bottom: 1px solid #202020;
}
.conversation:hover, .conversation.active { background: #242020; }
.conversation .details { min-width: 0; flex: 1; }
.conversation .details strong { display: block; margin-bottom: 5px; }
.conversation .preview {
  color: var(--muted); font-size: 12px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.dot {
  width: 9px; height: 9px; display: inline-block;
  border-radius: 50%; background: #35c759;
}
.main { display: flex; flex-direction: column; min-width: 0; }
.chat-header {
  display: flex; align-items: center; gap: 12px;
  padding: 15px 20px; border-bottom: 1px solid var(--border);
}
.chat-person { flex: 1; }
.chat-person strong { display: block; margin-bottom: 5px; }
.chat-person small { color: var(--muted); }
.icon-btn {
  border: 1px solid var(--border); color: white;
  background: var(--card); border-radius: 10px;
  min-width: 40px; min-height: 40px; padding: 8px;
}
.icon-btn:hover { border-color: var(--red); }
.messages {
  flex: 1; overflow-y: auto; padding: 22px;
  display: flex; flex-direction: column; gap: 13px;
}
.empty { margin: auto; color: var(--muted); text-align: center; }
.message { max-width: min(75%, 520px); align-self: flex-start; }
.message.mine { align-self: flex-end; }
.bubble {
  padding: 11px 14px; border-radius: 17px;
  background: #222; overflow-wrap: anywhere;
  line-height: 1.45;
}
.mine .bubble { background: var(--red-dark); }
.message time {
  display: block; color: var(--muted);
  font-size: 10px; margin: 5px 5px 0;
}
.message img, .message video {
  display: block; max-width: 100%;
  max-height: 340px; border-radius: 12px;
  cursor: pointer;
}
.message audio { max-width: 100%; }
.reply-preview {
  background: #111; border-left: 3px solid var(--red);
  color: #ddd; padding: 7px 9px; margin-bottom: 7px;
  border-radius: 5px; font-size: 12px;
}
.message-actions { display: flex; gap: 5px; margin-top: 5px; }
.message-actions button {
  border: 0; background: transparent; color: #bbb;
  font-size: 12px; padding: 4px;
}
.message-actions button:hover { color: var(--red); }
.reaction { font-size: 12px; margin-top: 4px; }
.typing { color: var(--muted); font-size: 12px; padding: 0 22px 8px; }
.reply-bar {
  display: none; padding: 9px 18px;
  background: #181818; border-top: 1px solid var(--border);
  color: var(--muted); font-size: 13px;
}
.composer {
  border-top: 1px solid var(--border);
  padding: 13px 16px; display: flex;
  align-items: flex-end; gap: 8px;
}
.composer textarea {
  flex: 1; resize: none; min-width: 0;
  max-height: 120px; padding: 12px;
  background: var(--card); color: white;
  border: 1px solid var(--border); border-radius: 13px;
}
.send {
  background: var(--red); border: 0; color: white;
  border-radius: 11px; padding: 12px 16px;
  font-weight: bold;
}
.send:hover { background: var(--red-dark); }
.file-input { display: none; }
.status { font-size: 11px; color: var(--muted); padding: 0 17px 10px; }
#authScreen {
  position: fixed; inset: 0; z-index: 5;
  background: var(--bg); display: grid; place-items: center;
  padding: 20px;
}
.auth-card {
  width: min(100%, 380px); padding: 28px;
  background: var(--panel); border: 1px solid var(--border);
  border-radius: 18px;
}
.auth-card h1 { margin-top: 0; }
.auth-card p { color: var(--muted); font-size: 13px; }
.auth-input { margin: 7px 0; }
.auth-card .send { width: 100%; margin-top: 10px; }
.auth-switch { color: var(--red); cursor: pointer; }
#viewer {
  display: none; position: fixed; inset: 0; z-index: 10;
  background: rgba(0,0,0,.96); align-items: center;
  justify-content: center; padding: 20px;
}
#viewer img { max-width: 95vw; max-height: 90vh; object-fit: contain; }
#closeViewer {
  position: absolute; right: 20px; top: 20px;
  font-size: 24px;
}
@media (max-width: 700px) {
  .app { grid-template-columns: 1fr; }
  .sidebar { display: none; }
  .app.show-list .sidebar { display: flex; }
  .app.show-list .main { display: none; }
  .message { max-width: 88%; }
  .messages { padding: 15px; }
  .composer { padding: 9px; gap: 5px; }
  .composer .icon-btn { min-width: 35px; padding: 6px; }
  .send { padding: 12px; }
}
</style>
</head>

<body>
<div id="authScreen">
  <div class="auth-card">
    <div class="brand">dark<span>mess</span></div>
    <h1 id="authTitle">Welcome back</h1>
    <p>Private conversations, in one place.</p>
    <form id="authForm">
      <input class="auth-input" id="username" placeholder="Username" required minlength="3" maxlength="24" autocomplete="username">
      <input class="auth-input" id="password" type="password" placeholder="Password" required minlength="6" autocomplete="current-password">
      <button class="send" id="authSubmit" type="submit">Log in</button>
    </form>
    <p id="authMessage" role="status"></p>
    <p><span id="authSwitchText">New to darkmess?</span>
      <span class="auth-switch" id="authSwitch">Create account</span></p>
  </div>
</div>

<div class="app show-list" id="app">
  <aside class="sidebar">
    <div class="brand">dark<span>mess</span></div>
    <div class="profile">
      <div class="avatar" id="myAvatar">?</div>
      <div><strong id="myName">Your account</strong><br><small><span class="dot"></span> Online</small></div>
      <button class="icon-btn" id="logoutBtn" title="Log out">↪</button>
    </div>
    <div class="search"><input id="searchInput" placeholder="Search conversations..." aria-label="Search conversations"></div>
    <div class="section-label">Stories</div>
    <div class="stories" id="stories">
      <div class="story"><div class="story-ring"><div>+</div></div>Your story</div>
    </div>
    <div class="section-label">Messages</div>
    <div class="conversation-list" id="conversationList"></div>
    <div class="status" id="connectionStatus">Connecting…</div>
  </aside>

  <main class="main">
    <header class="chat-header">
      <button class="icon-btn" id="backBtn" title="Back to conversations">←</button>
      <div class="avatar" id="chatAvatar">?</div>
      <div class="chat-person"><strong id="chatName">Choose a conversation</strong><small id="chatStatus">Select a person to start</small></div>
      <button class="icon-btn" id="searchMessagesBtn" title="Search messages">⌕</button>
    </header>

    <div class="messages" id="messages">
      <div class="empty">Choose a conversation to begin messaging.</div>
    </div>
    <div class="typing" id="typingStatus" aria-live="polite"></div>
    <div class="reply-bar" id="replyBar"></div>

    <div class="composer">
      <button class="icon-btn" id="emojiBtn" title="Insert emoji">😊</button>
      <button class="icon-btn" id="photoBtn" title="Send photo">▧</button>
      <button class="icon-btn" id="videoBtn" title="Send video">▣</button>
      <button class="icon-btn" id="fileBtn" title="Attach file">＋</button>
      <button class="icon-btn" id="recordBtn" title="Record voice message">🎙</button>
      <input class="file-input" id="photoInput" type="file" accept="image/*">
      <input class="file-input" id="videoInput" type="file" accept="video/*">
      <input class="file-input" id="fileInput" type="file" accept="image/*,video/*,audio/*,.pdf,.txt">
      <textarea id="messageInput" rows="1" maxlength="4000" placeholder="Write a message..." aria-label="Write a message"></textarea>
      <button class="send" id="sendBtn">Send</button>
    </div>
  </main>
</div>

<div id="viewer">
  <button class="icon-btn" id="closeViewer">✕</button>
  <img id="viewerImage" alt="Shared image">
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
(() => {
  const $ = id => document.getElementById(id);
  let socket = null;
  let username = "";
  let authMode = "login";
  let activeChat = "";
  let replyTo = null;
  let recorder = null;
  let recordingChunks = [];
  let recording = false;
  let conversations = [];
  let mediaUrls = [];

  function safeText(value) {
    return String(value ?? "");
  }

  function showAuthMessage(message, error = false) {
    $("authMessage").textContent = message;
    $("authMessage").style.color = error ? "#ff5555" : "#aaaaaa";
  }

  $("authSwitch").onclick = () => {
    authMode = authMode === "login" ? "signup" : "login";
    $("authTitle").textContent = authMode === "login" ? "Welcome back" : "Create account";
    $("authSubmit").textContent = authMode === "login" ? "Log in" : "Sign up";
    $("authSwitchText").textContent = authMode === "login" ? "New to darkmess?" : "Already have an account?";
    $("authSwitch").textContent = authMode === "login" ? "Create account" : "Log in";
    $("password").autocomplete = authMode === "login" ? "current-password" : "new-password";
    showAuthMessage("");
  };

  $("authForm").addEventListener("submit", async event => {
    event.preventDefault();
    const name = $("username").value.trim();
    const password = $("password").value;
    if (!/^[a-zA-Z0-9_]{3,24}$/.test(name)) {
      showAuthMessage("Use 3–24 letters, numbers or underscores for your username.", true);
      return;
    }
    try {
      $("authSubmit").disabled = true;
      const response = await fetch("/api/" + authMode, {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        credentials: "same-origin",
        body: JSON.stringify({username: name, password})
      });
      const data = await response.json();
      if (!response.ok || !data.success) throw new Error(data.message || "Authentication failed.");
      username = data.username || name;
      $("authScreen").style.display = "none";
      $("myName").textContent = username;
      $("myAvatar").textContent = username.charAt(0).toUpperCase();
      connectChat();
    } catch (error) {
      showAuthMessage(error.message || "Could not connect to server.", true);
    } finally {
      $("authSubmit").disabled = false;
    }
  });

  function connectChat() {
    if (typeof io !== "function") {
      $("connectionStatus").textContent = "Socket.IO not available. Check server.js.";
      return;
    }
    socket = io();
    socket.on("connect", () => {
      $("connectionStatus").textContent = "Connected";
      // The backend must verify the session; never trust a username supplied by the browser.
      socket.emit("join chat", username);
    });
    socket.on("disconnect", () => $("connectionStatus").textContent = "Disconnected");
    socket.on("chat history", history => {
      $("messages").replaceChildren();
      (Array.isArray(history) ? history : []).forEach(addMessage);
      scrollToBottom();
    });
    socket.on("chat message", message => {
      if (!message || !message.username) return;
      if (!activeChat || message.username === activeChat || message.username === username) {
        addMessage(message);
        scrollToBottom();
      }
      refreshConversations();
    });
    socket.on("typing", data => {
      if (data && data.username && data.username !== username && data.username === activeChat) {
        $("typingStatus").textContent = data.isTyping ? data.username + " is typing…" : "";
      }
    });
    socket.on("user online", data => {
      if (data && data.username === activeChat) $("chatStatus").textContent = "Online";
    });
    socket.on("user offline", data => {
      if (data && data.username === activeChat) $("chatStatus").textContent = "Offline";
    });
    socket.on("message deleted", data => {
      const node = document.querySelector('[data-message-id="' + CSS.escape(String(data.id)) + '"]');
      if (node) node.remove();
    });
    socket.on("message reaction", data => {
      const node = document.querySelector('[data-message-id="' + CSS.escape(String(data.id)) + '"] .reaction');
      if (node) node.textContent = data.reaction || "";
    });
    refreshConversations();
  }

  async function refreshConversations() {
    try {
      const response = await fetch("/api/users", {credentials: "same-origin"});
      if (!response.ok) return;
      const data = await response.json();
      const users = Array.isArray(data.users) ? data.users : [];
      conversations = users.filter(user => user.username && user.username !== username);
      renderConversations($("searchInput").value);
    } catch (_) {
      // The existing server may not yet implement /api/users.
    }
  }

  function renderConversations(filter = "") {
    const list = $("conversationList");
    list.replaceChildren();
    conversations.filter(person => person.username.toLowerCase().includes(filter.toLowerCase()))
      .forEach(person => {
        const button = document.createElement("button");
        button.className = "conversation" + (activeChat === person.username ? " active" : "");
        const avatar = document.createElement("div");
        avatar.className = "avatar";
        avatar.textContent = person.username.charAt(0).toUpperCase();
        const details = document.createElement("div");
        details.className = "details";
        const name = document.createElement("strong");
        name.textContent = person.username;
        const preview = document.createElement("div");
        preview.className = "preview";
        preview.textContent = person.online ? "Online" : "Start a conversation";
        details.append(name, preview);
        button.append(avatar, details);
        button.onclick = () => openConversation(person.username);
        list.append(button);
      });
    if (!list.children.length) {
      const empty = document.createElement("p");
      empty.className = "status";
      empty.textContent = "No other users found.";
      list.append(empty);
    }
  }

  function openConversation(person) {
    activeChat = person;
    $("app").classList.remove("show-list");
    $("chatName").textContent = person;
    $("chatAvatar").textContent = person.charAt(0).toUpperCase();
    $("chatStatus").textContent = "Conversation";
    $("messages").replaceChildren();
    $("messages").innerHTML = '<div class="empty">Loading conversation…</div>';
    $("typingStatus").textContent = "";
    renderConversations($("searchInput").value);
    if (socket) socket.emit("open conversation", {with: person});
    // This event needs a server-side handler that returns only this conversation.
  }

  function scrollToBottom() {
    $("messages").scrollTop = $("messages").scrollHeight;
  }

  function addMessage(data) {
    const isMine = data.username === username || data.user === username;
    const author = data.username || data.user || "Unknown";
    const content = data.text || data.content || "";
    const row = document.createElement("div");
    row.className = "message" + (isMine ? " mine" : "");
    if (data.id != null) row.dataset.messageId = String(data.id);

    const bubble = document.createElement("div");
    bubble.className = "bubble";

    if (data.replyToText) {
      const quote = document.createElement("div");
      quote.className = "reply-preview";
      quote.textContent = data.replyToText;
      bubble.append(quote);
    }

    if (data.mediaUrl && data.mediaType) {
      if (data.mediaType.startsWith("image/")) {
        const img = document.createElement("img");
        img.src = data.mediaUrl;
        img.alt = "Shared photo";
        img.onclick = () => showImage(data.mediaUrl);
        bubble.append(img);
      } else if (data.mediaType.startsWith("video/")) {
        const video = document.createElement("video");
        video.src = data.mediaUrl;
        video.controls = true;
        video.playsInline = true;
        bubble.append(video);
      } else if (data.mediaType.startsWith("audio/")) {
        const audio = document.createElement("audio");
        audio.src = data.mediaUrl;
        audio.controls = true;
        bubble.append(audio);
      } else {
        const link = document.createElement("a");
        link.href = data.mediaUrl;
        link.textContent = "Open attachment";
        link.target = "_blank";
        link.rel = "noopener noreferrer";
        bubble.append(link);
      }
    } else {
      const text = document.createElement("div");
      text.textContent = content;
      bubble.append(text);
    }

    row.append(bubble);
    const time = document.createElement("time");
    const date = data.timestamp ? new Date(data.timestamp) : new Date();
    time.textContent = date.toLocaleTimeString([], {hour: "2-digit", minute: "2-digit"});
    row.append(time);

    const actions = document.createElement("div");
    actions.className = "message-actions";
    const replyButton = document.createElement("button");
    replyButton.textContent = "Reply";
    replyButton.onclick = () => setReply(content || "Attachment", data.id);
    const reactButton = document.createElement("button");
    reactButton.textContent = "❤️";
    reactButton.title = "React with heart";
    reactButton.onclick = () => {
      if (socket && data.id != null) socket.emit("message reaction", {id: data.id, reaction: "❤️"});
    };
    actions.append(replyButton, reactButton);
    if (isMine && data.id != null) {
      const deleteButton = document.createElement("button");
      deleteButton.textContent = "Delete";
      deleteButton.onclick = () => {
        if (socket) socket.emit("delete message", {id: data.id});
      };
      actions.append(deleteButton);
    }
    row.append(actions);

    if (data.reaction) {
      const reaction = document.createElement("div");
      reaction.className = "reaction";
      reaction.textContent = data.reaction;
      row.append(reaction);
    }
    $("messages").appe
