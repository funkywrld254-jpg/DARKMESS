
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>darkmess</title>
<script src="/socket.io/socket.io.js"></script>
<style>
*{box-sizing:border-box}
body{margin:0;background:#080808;color:white;font-family:Arial,sans-serif}
header{padding:18px;background:#111;border-bottom:2px solid #ff2438}
h1{margin:0;color:#ff2438}
main{max-width:650px;margin:25px auto;padding:15px}
.panel{background:#141414;border:1px solid #333;border-radius:14px;padding:20px;margin-bottom:15px}
input,button{width:100%;padding:13px;margin:7px 0;border-radius:8px;font-size:16px}
input{background:#080808;color:white;border:1px solid #444}
button{background:#ff2438;color:white;border:0;font-weight:bold;cursor:pointer}
button:hover{background:#d8172a}
.secondary{background:#292929}
#chat{display:none}
#messages{height:330px;overflow-y:auto;border:1px solid #333;padding:12px;border-radius:8px}
.message{background:#222;padding:10px;margin:8px 0;border-radius:9px;overflow-wrap:anywhere}
.mine{border-left:3px solid #ff2438}
.small{color:#aaa;font-size:13px}
#status{color:#ff6877}
</style>
</head>
<body>
<header><h1>darkmess</h1><div class="small">Your space. Your conversations.</div></header>

<main>
<section class="panel" id="auth">
<h2 id="authTitle">Log in</h2>
<form id="authForm">
<input id="username" placeholder="Username" required autocomplete="username">
<input id="password" type="password" placeholder="Password" required autocomplete="current-password">
<button id="submitBtn" type="submit">Log in</button>
</form>
<button class="secondary" id="switchBtn" type="button">Create an account</button>
<p id="status"></p>
</section>

<section class="panel" id="chat">
<h2>Welcome, <span id="who"></span></h2>
<p class="small">darkmess chat</p>
<div id="messages"></div>
<form id="messageForm">
<input id="messageInput" placeholder="Write a message..." maxlength="2000" required>
<button type="submit">Send message</button>
</form>
<button class="secondary" id="logoutBtn" type="button">Log out</button>
<p id="chatStatus" class="small"></p>
</section>
</main>

<script>
const $ = id => document.getElementById(id);
let isSignup = false;
let currentUser = "";
let socket = null;

function status(message){
  $("status").textContent = message;
}

$("switchBtn").addEventListener("click", () => {
  isSignup = !isSignup;
  $("authTitle").textContent = isSignup ? "Create account" : "Log in";
  $("submitBtn").textContent = isSignup ? "Sign up" : "Log in";
  $("switchBtn").textContent = isSignup ? "I already have an account" : "Create an account";
  $("password").autocomplete = isSignup ? "new-password" : "current-password";
  status("");
});

$("authForm").addEventListener("submit", async event => {
  event.preventDefault();
  const username = $("username").value.trim();
  const password = $("password").value;
  if (!username || !password) return status("Enter your username and password.");

  $("submitBtn").disabled = true;
  status("Please wait...");

  try {
    const response = await fetch(isSignup ? "/api/signup" : "/api/login", {
      method: "POST",
      headers: {"Content-Type":"application/json"},
      body: JSON.stringify({username, password})
    });

    const data = await response.json();
    if (!response.ok || !data.success) {
      throw new Error(data.error || "Unable to continue.");
    }

    openChat(data.username || username);
  } catch (error) {
    status(error.message || "Connection failed. Try again.");
  } finally {
    $("submitBtn").disabled = false;
  }
});

function addMessage(data) {
  if (!data) return;
  const item = document.createElement("div");
  item.className = "message" +
    (data.user === currentUser ? " mine" : "");

  const name = document.createElement("strong");
  name.textContent = data.user || "User";

  const content = document.createElement("div");
  content.textContent = typeof data.text === "string" ? data.text : "";

  item.append(name, content);
  $("messages").appendChild(item);
  $("messages").scrollTop = $("messages").scrollHeight;
}

function openChat(username) {
  currentUser = username;
  $("who").textContent = username;
  $("auth").style.display = "none";
  $("chat").style.display = "block";
  $("messages").replaceChildren();

  socket = io();

  socket.on("connect", () => {
    $("chatStatus").textContent = "Connected";
    socket.emit("join chat", currentUser);
  });

  socket.on("connect_error", () => {
    $("chatStatus").textContent = "Chat connection failed. Refresh and try again.";
  });

  socket.on("disconnect", () => {
    $("chatStatus").textContent = "Disconnected. Reconnecting...";
  });

  socket.on("chat history", history => {
    $("messages").replaceChildren();
    history.forEach(addMessage);
  });

  socket.on("chat message", addMessage);
}

$("messageForm").addEventListener("submit", event => {
  event.preventDefault();
  const text = $("messageInput").value.trim();
  if (!text || !socket || !socket.connected) {
    $("chatStatus").textContent = "Not connected to chat yet.";
    return;
  }

  socket.emit("chat message", text);
  $("messageInput").value = "";
});

$("logoutBtn").addEventListener("click", async () => {
  if (socket) socket.disconnect();

  try {
    await fetch("/api/logout", {method:"POST"});
  } catch (_) {}

  currentUser = "";
  $("chat").style.display = "none";
  $("auth").style.display = "block";
  $("password").value = "";
  status("You have logged out.");
});
</script>
</body>
</html>
