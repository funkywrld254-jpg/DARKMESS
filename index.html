
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>darkmess</title>
<style>
:root{--bg:#080808;--panel:#111;--red:#ff2638;--line:#292929;--muted:#999}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:#fff;font:15px Arial,sans-serif}
button,input{font:inherit}
button{cursor:pointer;border:0;border-radius:10px;background:var(--red);color:#fff;padding:11px 14px;font-weight:bold}
input{background:#090909;border:1px solid #303030;color:#fff;padding:12px;border-radius:10px;width:100%}
.hidden{display:none!important}
.brand{font-size:25px;font-weight:900}.brand span{color:var(--red)}
.muted,.preview{color:var(--muted)}
.error{color:#ff6672;min-height:20px}
.auth{max-width:390px;margin:9vh auto;padding:25px;background:var(--panel);border:1px solid var(--line);border-radius:18px}
.stack{display:grid;gap:12px}
.auth h2{margin:24px 0 8px}
.switch{background:transparent;border:1px solid #333;width:100%}
.app{height:100dvh;display:grid;grid-template-columns:310px 1fr;max-width:1200px;margin:auto}
.sidebar{min-height:0;border-right:1px solid var(--line);display:flex;flex-direction:column;background:#0c0c0c}
.sidehead{padding:18px;border-bottom:1px solid var(--line)}
.search{margin-top:15px}
.people{overflow:auto;padding:8px;flex:1}
.person{display:flex;align-items:center;gap:11px;padding:12px;border-radius:12px;cursor:pointer}
.person:hover,.person.active{background:#1b1b1b}
.avatar{width:42px;height:42px;flex:0 0 42px;border-radius:50%;background:#292929;display:grid;place-items:center;overflow:hidden;border:1px solid #333;font-weight:bold}
.avatar img{width:100%;height:100%;object-fit:cover}
.personname{font-weight:bold}.preview{font-size:12px;margin-top:5px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.sidefoot{padding:12px;border-top:1px solid var(--line);display:flex;gap:8px;align-items:center}
.sidefoot button{padding:9px;font-size:12px}
.profilebox{padding:14px;border-bottom:1px solid var(--line)}
.profilebox input{margin-top:8px}
.chat{min-width:0;display:flex;flex-direction:column}
.chathead{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:11px;min-height:72px}
.chatbody{flex:1;min-height:0;overflow:auto;padding:20px;display:flex;flex-direction:column;gap:10px}
.welcome{margin:auto;text-align:center;color:var(--muted);padding:25px}
.bubble{max-width:min(75%,560px);background:#1a1a1a;border:1px solid #2b2b2b;border-radius:16px 16px 16px 4px;padding:10px 12px;overflow-wrap:anywhere}
.bubble.mine{align-self:flex-end;background:#421219;border-color:#70202a;border-radius:16px 16px 4px 16px}
.bubble img,.bubble video{max-width:100%;max-height:320px;border-radius:10px;display:block;margin-top:6px}
.bubble audio{max-width:100%;margin-top:6px}
.bubble a{color:#ff7883}.stamp{font-size:10px;color:#aaa;margin-top:6px;text-align:right}
.typing{color:var(--muted);font-size:12px;min-height:17px;padding:0 20px}
.composer{padding:12px;border-top:1px solid var(--line);display:flex;align-items:center;gap:8px}
.composer input[type=text]{flex:1;min-width:0}
.filelabel{display:inline-grid;place-items:center;background:#202020;border:1px solid #333;border-radius:10px;width:42px;height:42px;cursor:pointer;flex:0 0 42px}
.filelabel input{display:none}
.iconbtn{background:#202020;border:1px solid #333}
.small{font-size:12px}
.mobileback{display:none}
@media(max-width:680px){
 .app{grid-template-columns:1fr;border:0}
 .sidebar{grid-column:1;grid-row:1}
 .chat{grid-column:1;grid-row:1;display:none}
 .app.chat-open .sidebar{display:none}
 .app.chat-open .chat{display:flex}
 .sidehead{padding:14px}
 .chatbody{padding:14px}
 .bubble{max-width:88%}
 .mobileback{display:inline-block;background:#222;padding:8px 10px}
 .composer{padding:9px;gap:6px}
}
</style>
</head>
<body>
<section id="auth" class="auth">
 <div class="brand">dark<span>mess</span></div>
 <h2 id="authTitle">Sign in</h2>
 <p class="muted">Private chats. One simple place.</p>
 <form id="authForm" class="stack">
  <input id="username" autocomplete="username" placeholder="Username" minlength="3" maxlength="20" required>
  <input id="password" type="password" autocomplete="current-password" placeholder="Password" minlength="6" required>
  <button id="authSubmit">Sign in</button>
 </form>
 <p id="authError" class="error"></p>
 <button id="authSwitch" class="switch">Create account</button>
</section>

<main id="app" class="app hidden">
 <aside class="sidebar">
  <div class="sidehead">
   <div class="brand">dark<span>mess</span></div>
   <input id="search" class="search" placeholder="Search people..." autocomplete="off">
   <p class="muted small">Search by username or display name</p>
  </div>
  <div id="people" class="people"></div>
  <div class="profilebox">
   <div class="small muted">YOUR PROFILE</div>
   <input id="displayName" maxlength="40" placeholder="Display name">
   <div style="display:flex;gap:8px;margin-top:8px">
    <button id="saveProfile" class="iconbtn">Save name</button>
    <label class="filelabel" title="Change profile photo">📷<input id="profileFile" type="file" accept="image/*"></label>
   </div>
  </div>
  <div class="sidefoot">
   <div id="myAvatar" class="avatar">?</div>
   <div style="min-width:0;flex:1"><div id="myName" class="personname"></div><div id="myUsername" class="preview"></div></div>
   <button id="logout" class="iconbtn">Log out</button>
  </div>
 </aside>

 <section class="chat">
  <header class="chathead">
   <button id="back" class="mobileback">←</button>
   <div id="chatAvatar" class="avatar">D</div>
   <div><div id="chatName" class="personname">Choose a chat</div><div id="chatStatus" class="preview">Search for people to start</div></div>
  </header>
  <div id="chatBody" class="chatbody"><div class="welcome"><div class="brand">dark<span>mess</span></div><p>Choose someone to start messaging.</p></div></div>
  <div id="typing" class="typing"></div>
  <form id="composer" class="composer">
   <label class="filelabel" title="Attach media">＋<input id="mediaFile" type="file" accept="image/jpeg,image/png,image/gif,image/webp,video/mp4,video/webm,video/quicktime,audio/mpeg,audio/mp4,audio/ogg,audio/wav,audio/webm,application/pdf,text/plain"></label>
   <input id="message" type="text" maxlength="5000" placeholder="Write a message..." autocomplete="off">
   <button id="send" type="submit">Send</button>
  </form>
  <div id="chatError" class="error" style="padding:0 12px"></div>
 </section>
</main>

<script src="/socket.io/socket.io.js"></script>
<script>
const $=id=>document.getElementById(id);
let me=null,peer=null,socket=null,isSignup=false,peopleCache=[],onlineUsers=new Set(),typingTimer=null,selectedMedia=null;
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
async function api(url,options={}){
 const r=await fetch(url,{credentials:"same-origin",...options});
 const d=await r.json().catch(()=>({}));
 if(!r.ok)throw new Error(d.error||"Request failed");
 return d;
}
function avatarHtml(u){return u?.profile_picture?`<img src="${esc(u.profile_picture)}" alt="">`:esc((u?.display_name||u?.username||"?").slice(0,1).toUpperCase())}
function setAvatar(el,u){el.innerHTML=avatarHtml(u)}
function err(id,msg){$(id).textContent=msg||""}

$("authSwitch").onclick=()=>{
 isSignup=!isSignup;
 $("authTitle").textContent=isSignup?"Create account":"Sign in";
 $("authSubmit").textContent=isSignup?"Create account":"Sign in";
 $("authSwitch").textContent=isSignup?"I already have an account":"Create account";
 $("password").autocomplete=isSignup?"new-password":"current-password";
 err("authError","");
};
$("authForm").onsubmit=async e=>{
 e.preventDefault();err("authError","");$("authSubmit").disabled=true;
 try{
  const d=await api(isSignup?"/api/signup":"/api/login",{
   method:"POST",headers:{"Content-Type":"application/json"},
   body:JSON.stringify({username:$("username").value,password:$("password").value})
  });
  await startApp(d.user);
 }catch(e){err("authError",e.message)}
 finally{$("authSubmit").disabled=false}
};
async function start(){
 try{const d=await api("/api/me");if(d.user)await startApp(d.user)}catch{}
}
async function startApp(user){
 me=user;$("auth").classList.add("hidden");$("app").classList.remove("hidden");
 $("displayName").value=user.display_name||user.username;
 $("myName").textContent=user.display_name||user.username;
 $("myUsername").textContent="@"+user.username;setAvatar($("myAvatar"),user);
 socket=io();wireSocket();await loadPeople("");
}
function wireSocket(){
 socket.on("connect_error",()=>err("chatError","Connection issue. Refresh and log in again."));
 socket.on("presence",users=>{onlineUsers=new Set(users);renderPeople();if(peer)updateChatStatus()});
 socket.on("conversation history",messages=>{if(peer)renderMessages(messages)});
 socket.on("new message",m=>{
  if(peer&&(m.username===peer||m.recipient===peer)){
   addMessage(m);
   if(m.username!==me.username)socket.emit("open conversation",peer);
  }
  loadPeople($("search").value);
 });
 socket.on("typing",u=>{if(u===peer)$("typing").textContent=u+" is typing…"});
 socket.on("stop typing",u=>{if(u===peer)$("typing").textContent=""});
 socket.on("chat error",m=>err("chatError",m));
}
async function loadPeople(q){
 try{
  const [u,i]=await Promise.all([
   api("/api/users?q="+encodeURIComponent(q)),
   api("/api/inbox")
  ]);
  peopleCache=u.users||[];
  const map=new Map();
  (i.conversations||[]).forEach(c=>map.set(c.user.username,{...c.user,preview:c.text||(c.media_url?"📎 Attachment":"Start a conversation")}));
  peopleCache.forEach(p=>{if(!map.has(p.username))map.set(p.username,p)});
  renderPeople([...map.values()]);
 }catch(e){$("people").innerHTML=`<p class="muted">${esc(e.message)}</p>`}
}
function renderPeople(list){
 list=list||peopleCache;
 const q=$("search").value.trim().toLowerCase();
 if(q)list=list.filter(p=>(p.username+" "+(p.display_name||"")).toLowerCase().includes(q));
 if(!list.length){
  $("people").innerHTML=`<p class="muted" style="padding:12px">${q?"No users found. Check the spelling.":"No other users yet. Create a second account to test chats."}</p>`;
  return;
 }
 $("people").innerHTML=list.map(p=>`<div class="person ${peer===p.username?"active":""}" data-user="${esc(p.username)}"><div class="avatar">${avatarHtml(p)}</div><div style="min-width:0;flex:1"><div class="personname">${esc(p.display_name||p.username)}</div><div class="preview">${onlineUsers.has(p.username)?"● Online · ":""}${esc(p.preview||("@"+p.username))}</div></div></div>`).join("");
 $("people").querySelectorAll(".person").forEach(el=>el.onclick=()=>openChat(el.dataset.user));
}
$("search").addEventListener("input",()=>loadPeople($("search").value));
async function openChat(username){
 peer=username;$("app").classList.add("chat-open");err("chatError","");$("typing").textContent="";
 const p=peopleCache.find(x=>x.username===username)||{username,display_name:username};
 $("chatName").textContent=p.display_name||username;setAvatar($("chatAvatar"),p);updateChatStatus();
 $("chatBody").innerHTML='<div class="welcome">Loading messages…</div>';
 renderPeople();socket.emit("open conversation",username);
}
function updateChatStatus(){$("chatStatus").textContent=onlineUsers.has(peer)?"● Online":"@"+peer}
$("back").onclick=()=>{$("app").classList.remove("chat-open");peer=null};
function renderMessages(messages){$("chatBody").innerHTML="";messages.forEach(addMessage);scrollBottom()}
function addMessage(m){
 if(!peer||!(m.username===peer||m.recipient===peer))return;
 if($("chatBody").querySelector(`[data-id="${m.id}"]`))return;
 const mine=m.username===me.username,b=document.createElement("div");
 b.className="bubble"+(mine?" mine":"");b.dataset.id=m.id;
 let html="";
 if(m.text)html+=`<div>${esc(m.text).replace(/\n/g,"<br>")}</div>`;
 if(m.media_url){
  const url=esc(m.media_url),type=m.media_type||"",name=esc(m.media_name||"Attachment");
  if(type.startsWith("image/"))html+=`<a href="${url}" target="_blank" rel="noopener"><img src="${url}" alt="${name}" loading="lazy"></a>`;
  else if(type.startsWith("video/"))html+=`<video controls preload="metadata" src="${url}"></video>`;
  else if(type.startsWith("audio/"))html+=`<audio controls preload="metadata" src="${url}"></audio>`;
  else html+=`<a href="${url}" target="_blank" rel="noopener">📎 ${name}</a>`;
 }
 html+=`<div class="stamp">${mine?"You · ":""}${new Date(m.timestamp).toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"})}</div>`;
 b.innerHTML=html;$("chatBody").appendChild(b);scrollBottom();
}
function scrollBottom(){$("chatBody").scrollTop=$("chatBody").scrollHeight}
$("message").addEventListener("input",()=>{
 if(!peer)return;
 socket.emit("typing",peer);clearTimeout(typingTimer);
 typingTimer=setTimeout(()=>socket.emit("stop typing",peer),900);
});
$("composer").onsubmit=async e=>{
 e.preventDefault();
 if(!peer){err("chatError","Choose someone first.");return}
 const text=$("message").value.trim();
 if(!text&&!selectedMedia)return;
 $("send").disabled=true;err("chatError","");
 try{
  let media=null;
  if(selectedMedia){
   const f=new FormData();f.append("file",selectedMedia);
   media=await api("/api/message-upload",{method:"POST",body:f});
  }
  socket.emit("chat message",{recipient:peer,text,media_url:media?.url||null,media_type:media?.type||null,media_name:media?.name||null});
  $("message").value="";selectedMedia=null;$("mediaFile").value="";
  $("message").placeholder="Write a message...";
  socket.emit("stop typing",peer);
 }catch(e){err("chatError",e.message)}
 finally{$("send").disabled=false}
};
$("mediaFile").onchange=()=>{
 const f=$("mediaFile").files[0];if(!f)return;
 if(f.size>15*1024*1024){err("chatError","File must be 15 MB or smaller.");$("mediaFile").value="";return}
 selectedMedia=f;$("message").placeholder="Ready to send: "+f.name;
};
$("saveProfile").onclick=async()=>{
 try{
  const d=await api("/api/profile",{method:"PATCH",headers:{"Content-Type":"application/json"},body:JSON.stringify({display_name:$("displayName").value})});
  me=d.user;$("myName").textContent=me.display_name;$("displayName").value=me.display_name;
  err("chatError","Profile updated.");await loadPeople($("search").value);
 }catch(e){err("chatError",e.message)}
};
$("profileFile").onchange=async()=>{
 const f=$("profileFile").files[0];if(!f)return;
 const data=new FormData();data.append("image",f);
 try{
  const d=await api("/api/profile-picture",{method:"POST",body:data});
  me=d.user;setAvatar($("myAvatar"),me);await loadPeople($("search").value);
  err("chatError","Profile photo updated.");
 }catch(e){err("chatError",e.message)}
 finally{$("profileFile").value=""}
};
$("logout").onclick=async()=>{try{await api("/api/logout",{method:"POST"})}finally{location.reload()}};
start();
</script>
</body>
</html>
